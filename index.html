<!doctype html>
<html lang="en">
<head>
  <link rel="canonical" href="https://rng-infinite.com/">
  <script>
    // Adresse officielle : le miroir GitHub Pages et les autres adresses renvoient vers rng-infinite.com (même page, même #).
    if (/github\.io$|vercel\.app$/.test(location.hostname)) location.replace('https://rng-infinite.com/' + location.hash);
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RNG∞</title>
  <meta name="description" content="Infinite version of rngdle.com (https://www.rngdle.com): roll a number from 0 to 1,000,000, earn badges and XP, track your history and climb the leaderboard with friends.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Press+Start+2P&family=Graduate&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4923f0cd97">
  <script>
    // Thème appliqué avant le rendu pour éviter le flash.
    (function () {
      var pref = 'system';
      try { pref = (JSON.parse(localStorage.getItem('rnginf.v1')) || {}).settings.theme || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>

          <span>Shop</span>
        </a>
      </nav>
    </div>
    <div class="topbar-right">
      <div class="theme-switch" role="radiogroup" aria-label="Theme">

        </button>
        <button data-theme-pref="system" aria-label="System" title="System">

      <button class="player-btn" id="player-btn" title="Player & settings">

    </div>
